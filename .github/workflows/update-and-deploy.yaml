name: Update and deploy daily

on:
  schedule:
    - cron: "0 5 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  RENV_PATHS_ROOT: ~/.cache/R/renv

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: rocker/geospatial:4.6.1

    env:
      GITHUB_PAT: ${{ secrets.PAT}}

    steps:
      - uses: actions/checkout@v5

      #- uses: r-lib/actions/setup-r@v2
       # with:
        #  use-public-rspm: true

      - name: Set RENV_PATHS_ROOT
        shell: bash
        run: |
          echo "RENV_PATHS_ROOT=${{ runner.temp }}/renv" >> $GITHUB_ENV
      - name: Install and activate renv
        run: |
          install.packages("renv")
          renv::activate()
        shell: Rscript {0}
      - name: Get R and OS version
        id: get-version
        run: |
          cat("##[set-output name=os-version;]", sessionInfo()$running, "\n", sep = "")
          cat("##[set-output name=r-version;]", R.Version()$version.string, sep = "")
        shell: Rscript {0}

      - name: install C dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl build-essential cmake libudunits2-dev jq

      - name: Restore Renv package cache
        uses: actions/cache@v6
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{ inputs.cache-version }}-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{inputs.cache-version }}-

      - uses: r-lib/actions/setup-renv@v2

      #- name: Install R dependencies
       # run: |
        #  renv::restore(packages = c("curl", "data.table", "dplyr", "fable",
         # "fabletools", "feasts", "glue", "htmltools", "janitor", "lubridate",
          #"purrr", "tidyr", "tsibble", "usethis"))
        #shell: Rscript {0}

      - name: Update data
        run: |
          source("R/utils_data_wrangle.R")
          source("R/utils_get_data.R")
          source("R/utils_module_dataviz.R")
          source("R/utils_module_overview_month.R")
          source("R/utils_module_overview_week.R")
          source("R/utils_module_overview_year.R")
          source("R/utils_module_predictions.R")
          source("R/utils_module_zh_details.R")
          load("data/zh_old.rda")
          load("data/wi_old.rda")
          load("data/bs_old.rda")
          source("data-raw/02_get_updated_data.R")
          source("data-raw/03_prepare_data_for_modules.R")
        shell: Rscript {0}

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Deploy
        env:
          SHINY_ACC_NAME: ${{ secrets.SHINY_ACC_NAME }}
          TOKEN: ${{secrets.TOKEN}}
          SECRET: ${{secrets.SECRET}}
          APP_NAME: ${{secrets.APP_NAME}}
        run: |
          # Authenticate
          rsconnect::setAccountInfo(name = Sys.getenv("SHINY_ACC_NAME"),
                          token = Sys.getenv("TOKEN"),
                          secret = Sys.getenv("SECRET"))
          # Deploy
          rsconnect::deployApp(forceUpdate = TRUE,
                     appName = Sys.getenv("APP_NAME"),
                     appFiles = c(
            # Add any additional files unique to your app here.
            "R/",
            "inst/",
            "NAMESPACE",
            "DESCRIPTION",
            "app.R",
            ".Rbuildignore"
          ))
        shell: Rscript {0}
